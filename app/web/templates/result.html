<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>PO processada | Eletra</title></head>
<body>
  <main class="page-shell">
    <section class="brand-bar">
      <img src="/assets/logo%20eletra.png" alt="Eletra Energy Solutions" class="brand-logo">
      <span>Foreign Trade</span>
    </section>
    <section class="converter-card result-card">
      <p class="eyebrow">PROCESSAMENTO CONCLUÍDO</p>
      <h1>PO processada</h1>
      <p class="intro">O download do Excel foi iniciado.</p>
      <dl class="result-grid">
        <dt>PO</dt><dd id="result-po">—</dd>
        <dt>Fornecedor</dt><dd id="result-supplier">—</dd>
        <dt>Itens</dt><dd id="result-item-count">—</dd>
        <dt>Total das mercadorias</dt><dd id="result-merchandise-total">—</dd>
        <dt>SCs encontrados</dt><dd id="result-scs">—</dd>
        <dt>Tempo de processamento</dt><dd id="result-processing-seconds">—</dd>
      </dl>
      <p id="result-warnings" class="warning" hidden></p>
      <div class="actions">
        <a class="text-link" href="/">Processar outra PO</a>
      </div>
    </section>
  </main>
  <script>
    const storedResult = sessionStorage.getItem('totvs-last-result');

    if (!storedResult) {
      window.location.replace('/');
    } else {
      const result = JSON.parse(storedResult);
      document.getElementById('result-po').textContent = result.poNumber || '—';
      document.getElementById('result-supplier').textContent = result.supplier || '—';
      document.getElementById('result-item-count').textContent = result.itemCount || '—';
      document.getElementById('result-merchandise-total').textContent = result.merchandiseTotal || '—';
      document.getElementById('result-scs').textContent = result.scs || '—';
      document.getElementById('result-processing-seconds').textContent = `${result.processingSeconds || '0.00'} s`;

      if (result.warnings?.length) {
        const warnings = document.getElementById('result-warnings');
        warnings.textContent = `Avisos: ${result.warnings.join(', ')}`;
        warnings.hidden = false;
      }

      sessionStorage.removeItem('totvs-last-result');
    }
  </script>
</body>
</html>
