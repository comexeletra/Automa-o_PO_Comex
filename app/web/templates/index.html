<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <title>Conversor PO | Eletra</title>
</head>
<body>
  <main class="page-shell">
    <section class="brand-bar" aria-label="Eletra Energy Solutions">
      <img src="/assets/logo%20eletra.png" alt="Eletra Energy Solutions" class="brand-logo">
      <span>Foreign Trade</span>
    </section>
    <section class="converter-card">
      <p class="eyebrow">Automação</p>
      <h1>Conversor PO</h1>
      <p class="intro">Converta a PO em uma planilha estruturada para envio.</p>
      <form action="/process" method="post" enctype="multipart/form-data">
        <label class="upload-field" for="pdf-file">
          <span class="upload-icon" aria-hidden="true">↑</span>
          <span class="upload-title">Arraste e solte o PDF da PO</span>
          <span class="upload-help">Arquivos PDF de até {{ max_upload_mb }} MB</span>
          <span class="upload-control">
            <span class="upload-button">Escolher arquivo</span>
            <span id="file-name" class="file-name" aria-live="polite">Nenhum arquivo selecionado</span>
          </span>
          <input class="file-input" id="pdf-file" type="file" name="file" accept="application/pdf,.pdf" required>
        </label>
        <p id="processing-timer" class="processing-timer" role="status" aria-live="polite" hidden></p>
        <button type="submit">Processar PO <span aria-hidden="true">→</span></button>
      </form>
    </section>
    <p class="footer-note">Dados extraídos exclusivamente do relatório TOTVS.</p>
  </main>
  <script>
    const fileInput = document.getElementById('pdf-file');
    const fileName = document.getElementById('file-name');
    const uploadField = document.querySelector('.upload-field');
    const form = document.querySelector('form');
    const processButton = form.querySelector('button[type="submit"]');
    const processingTimer = document.getElementById('processing-timer');
    const maxUploadBytes = {{ max_upload_mb }} * 1024 * 1024;

    const showSelectedFile = (selectedFile) => {
      fileName.textContent = selectedFile ? selectedFile.name : 'Nenhum arquivo selecionado';
      uploadField.classList.toggle('has-file', Boolean(selectedFile));
      uploadField.classList.remove('is-dragging');
    };

    fileInput.addEventListener('change', () => {
      showSelectedFile(fileInput.files[0]);
      processingTimer.hidden = true;
    });

    const isPdf = (file) => file && (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'));

    ['dragenter', 'dragover'].forEach((eventName) => {
      uploadField.addEventListener(eventName, (event) => {
        event.preventDefault();
        uploadField.classList.add('is-dragging');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      uploadField.addEventListener(eventName, (event) => {
        event.preventDefault();
        uploadField.classList.remove('is-dragging');
      });
    });

    uploadField.addEventListener('drop', (event) => {
      const droppedFile = event.dataTransfer.files[0];
      if (!droppedFile) return;

      if (!isPdf(droppedFile)) {
        processingTimer.hidden = false;
        processingTimer.textContent = 'Solte apenas um arquivo PDF v\u00e1lido.';
        return;
      }

      const transfer = new DataTransfer();
      transfer.items.add(droppedFile);
      fileInput.files = transfer.files;
      processingTimer.hidden = true;
      showSelectedFile(droppedFile);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (fileInput.files[0]?.size > maxUploadBytes) {
        processingTimer.hidden = false;
        processingTimer.textContent = 'O PDF deve ter no máximo {{ max_upload_mb }} MB.';
        return;
      }
      const startedAt = performance.now();
      processButton.disabled = true;
      processButton.textContent = 'Processando PO...';
      processingTimer.hidden = false;

      const updateTimer = () => {
        const elapsedSeconds = Math.floor((performance.now() - startedAt) / 1000);
        const minutes = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
        const seconds = String(elapsedSeconds % 60).padStart(2, '0');
        processingTimer.textContent = `Processando PO: ${minutes}:${seconds}`;
      };

      updateTimer();
      const timerId = window.setInterval(updateTimer, 1000);

      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: new FormData(form),
        });

        if (!response.ok) {
          document.open();
          document.write(await response.text());
          document.close();
          return;
        }

        const workbook = await response.blob();
        const downloadUrl = URL.createObjectURL(workbook);
        const downloadLink = document.createElement('a');
        const filename = response.headers.get('Content-Disposition')
          ?.match(/filename="?([^";]+)"?/)?.[1] || 'po_totvs.xlsx';

        downloadLink.href = downloadUrl;
        downloadLink.download = filename;
        downloadLink.click();
        URL.revokeObjectURL(downloadUrl);

        sessionStorage.setItem('totvs-last-result', JSON.stringify({
          poNumber: decodeURIComponent(response.headers.get('X-PO-Number') || ''),
          supplier: decodeURIComponent(response.headers.get('X-Supplier') || ''),
          itemCount: response.headers.get('X-Item-Count') || '0',
          merchandiseTotal: decodeURIComponent(response.headers.get('X-Merchandise-Total') || ''),
          scs: decodeURIComponent(response.headers.get('X-SCs') || ''),
          warnings: JSON.parse(decodeURIComponent(response.headers.get('X-Warnings') || '[]')),
          processingSeconds: response.headers.get('X-Processing-Seconds') || '0.00',
        }));
        window.location.assign('/result');
      } catch (error) {
        console.error('Falha ao processar a PO:', error);
        processingTimer.textContent = 'Não foi possível processar a PO. Tente novamente.';
        processButton.textContent = 'Processar PO';
      } finally {
        window.clearInterval(timerId);
        processButton.disabled = false;
      }
    });
  </script>
</body>
</html>
