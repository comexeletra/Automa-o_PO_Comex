[project]
name = "automacao-po-comex"
version = "0.1.0"
description = "Conversor de pedidos TOTVS para Excel executado com FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2",
    "openpyxl",
    "pypdf",
    "python-multipart",
]

[tool.vercel]
# Keep the deployment entrypoint explicit. The same FastAPI app continues to
# work locally and with the existing Cloudflare adapter.
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "workers-py>=1.17.2",
    "workers-runtime-sdk",
]
